# ==============================================================================
# NGINX VHOST CONFIGURATION: CORPORATE WEBSITE
# Domain: astitvainnovation.in & www.astitvainnovation.in
# Root:   /www/wwwroot/astitvainnovation.in
# Server: 217.216.58.223
# ==============================================================================

# HTTP Port 80 -> Automatic HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name astitvainnovation.in www.astitvainnovation.in;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/astitvainnovation.in;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Port 443 -> Production Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astitvainnovation.in www.astitvainnovation.in;

    # Document Root (Strictly Separate from B2B Dashboard)
    root /www/wwwroot/astitvainnovation.in;
    index index.html;

    # SSL Certificate Configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/astitvainnovation.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/astitvainnovation.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for Backend API Service (Inquiries, Leads, Auth)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Static Assets Long-Term Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Strict Prohibition: Do not expose source files, hidden dotfiles, or backups
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|ts|tsx|map|bak|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
