server {
    listen 80;
    listen [::]:80;
    server_name astitvainnovation.com www.astitvainnovation.com;
    
    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astitvainnovation.com www.astitvainnovation.com;

    root /www/wwwroot/astitvainnovation.com;
    index index.html index.htm;

    # SSL Certificates (Managed by aaPanel / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/astitvainnovation.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/astitvainnovation.com/privkey.pem;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /www/wwwlogs/astitvainnovation.com.log;
    error_log /www/wwwlogs/astitvainnovation.com.error.log;
}
