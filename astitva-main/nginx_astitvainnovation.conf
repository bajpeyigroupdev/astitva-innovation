# Nginx Configuration for Astitva Innovation (astitvainnovation.in)
# Place this file in /etc/nginx/sites-available/astitvainnovation.in or in your aaPanel vhost config

server {
    listen 80;
    listen [::]:80;
    server_name astitvainnovation.in www.astitvainnovation.in;
    
    # Redirect all HTTP traffic to HTTPS securely
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name astitvainnovation.in www.astitvainnovation.in;

    root /www/wwwroot/astitvainnovation.in;
    index index.html index.htm;

    # SSL Certificates (Managed by aaPanel / Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/astitvainnovation.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/astitvainnovation.in/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression for high-performance asset loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Single Page Application (SPA) Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (1 Year max age with immutable cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /www/wwwlogs/astitvainnovation.in.log;
    error_log /www/wwwlogs/astitvainnovation.in.error.log;
}
